<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tập Ngữ Pháp IELTS - Trạm IELTS</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/base-g.css">
  <link rel="stylesheet" href="css/components-g.css">
  <link rel="stylesheet" href="css/exercise-g.css">

  <!-- Thư viện Marked chuyển kết quả AI thành bảng điểm đẹp mắt -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="container-g" id="appContainer">
  <a href="index-g.html" class="nav-back-g">
    <i class="fa-solid fa-arrow-left"></i> Trở về danh mục chuyên đề
  </a>
</div>

<script type="module">
  import { LessonRenderer } from './js/lesson-renderer-g.js';

  async function initLesson() {
    const appContainer = document.getElementById('appContainer');
    
    // Đọc tên chuyên đề từ URL (?tense=...)
    const urlParams = new URLSearchParams(window.location.search);
    const tense = urlParams.get('tense') || 'present-simple';

    try {
      // Tải đồng thời 2 file JSON lý thuyết và bài tập
      const [theoryRes, exerciseRes] = await Promise.all([
        fetch(`data/${tense}/theory-${tense}-g.json`),
        fetch(`data/${tense}/exercises-${tense}-g.json`)
      ]);

      if (!theoryRes.ok || !exerciseRes.ok) {
        throw new Error("Không tìm thấy file JSON của bài học này.");
      }

      const theoryData = await theoryRes.json();
      const exerciseData = await exerciseRes.json();

      // Khởi tạo LessonRenderer với tense để kích hoạt tự động lưu
      const renderer = new LessonRenderer(appContainer, theoryData, exerciseData, tense);
      renderer.renderAll();

    } catch (err) {
      console.error(err);
      appContainer.innerHTML += `
        <div style="background:#FFF5F5; color:#991B1B; padding:24px; border-radius:18px; border:2px solid #FCA5A5; margin-top:20px;">
          <h3 style="margin:0 0 8px 0; font-size:18px; font-weight:900;">⚠️ Chưa tìm thấy dữ liệu bài học!</h3>
          <p style="margin:0; font-weight:700; font-size:14px;">Hệ thống không tìm thấy file cho chuyên đề: <b>${tense}</b>. Em hãy quay lại danh mục để chọn bài khác nhé.</p>
        </div>
      `;
    }
  }

  // Bắt đầu chạy
  initLesson();
</script>
<script type="module" src="../js/auth-lock.js"></script>
</body>
</html>
